[project]
name = "backhome"
version = "0.1.0"
description = "Agent-native immigration paperwork: raw docs -> sourced facts -> form sheet -> browser fill -> recon"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "pypdf[crypto]>=5.0"]

[project.scripts]
backhome = "backhome.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backhome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
